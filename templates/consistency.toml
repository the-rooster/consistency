# Project-level configuration for the consistency framework.
# Lives at the project root. The drift checker reads this to know
# how to run BDD, CodeQL, and other enforcement mechanisms.

[project]
# Glob patterns of paths to scan for @design annotations.
# Typically your source tree, excluding generated files and tests.
source_globs = ["src/**/*", "lib/**/*", "app/**/*"]
exclude_globs = ["**/node_modules/**", "**/__pycache__/**", "**/.venv/**"]

[bdd]
# How to run the BDD suite and where scenario files live.
# framework: one of "behave", "pytest-bdd", "cucumber-js", "godog",
# "specflow", "playwright-bdd", "cypress-cucumber"
framework = "behave"
features_dir = "features"
# Command run by the drift checker to verify scenarios.
command = "behave"
# How the tag for a single constraint is appended to `command`.
# Tokens: {tag} = the full tag (e.g. "@design-a--c1"),
#         {tag_unprefixed} = the same without the leading "@".
# Defaults below work for behave, pytest-bdd, cucumber-js, godog.
# Examples for other frameworks:
#   cypress-cucumber: tag_arg_format = "--env tags={tag}"
#   jest with -t:     tag_arg_format = "-t {tag_unprefixed}"
#   playwright-bdd:   wrap in a script — `command = "scripts/run-bdd.sh"`
tag_arg_format = "--tags {tag}"

[bdd.coverage]
# Optional cross-check: run BDD scenarios with coverage instrumentation
# scoped to one constraint's tag, then verify (a) every annotation for
# that constraint sits in code the scenarios actually exercise, and
# (b) heavily-covered files that have no annotation get flagged as
# candidates.
#
# This check is heavy (re-runs the BDD suite under coverage), so it is
# off by default and only runs when the checker is invoked with
# --with-coverage. Wire it into CI, not pre-commit.
enabled = false
# Command template. Tokens:
#   {bdd_command}, {tag_args}, {report_path}
# The command must produce a coverage report at report_path.
# Python (coverage.py):
#   command = "coverage run -m {bdd_command} {tag_args} && coverage json -o {report_path}"
# JS/TS (c8):
#   command = "c8 --reporter=json --report-dir=.consistency/cov-tmp {bdd_command} {tag_args} && cp .consistency/cov-tmp/coverage-final.json {report_path}"
command = "coverage run -m {bdd_command} {tag_args} && coverage json -o {report_path}"
# Where the coverage report ends up. Re-used per-constraint.
report_path = ".consistency/coverage.json"
# Format of the report at report_path.
# One of: "coverage.py" | "istanbul"
format = "coverage.py"
# A file with this fraction of its statements covered by a design's
# scenarios — but with no @design annotation — is flagged as a
# covered-unannotated candidate.
heavy_coverage_threshold = 0.5

[codeql]
# CodeQL is preferred for structural/cross-cutting constraints.
# The drift checker invokes the CodeQL CLI; install it once per dev
# machine and CI runner.
enabled = true
# Path to your CodeQL database. The checker rebuilds it when source
# changes. For a polyglot repo, use a list and the checker iterates.
database_dir = ".consistency/codeql-db"
language = "python"
# Optional: extra search path for CodeQL libraries (the standard
# library packs ship with the CLI; only set this if you depend on
# custom packs).
# search_path = ["vendor/codeql-packs"]

[linter]
# Map linter_rule identifiers from design docs to actual commands.
# The drift checker runs the listed command and treats non-zero exit
# as a constraint violation.
# rules.example = { command = "ruff check --select MY001 ." }

[pre-commit]
# Path the consistency framework writes its hook script to. The
# framework appends to .pre-commit-config.yaml; existing hooks are
# preserved.
hook_script_dir = "scripts/hooks"

[claude-hooks]
# Path the consistency framework writes Claude Code hook scripts to.
# settings.json in .claude/ is updated to reference scripts here.
hook_script_dir = ".claude/hooks"

[checker]
# Whether the drift checker should treat warnings as errors when run
# from pre-commit. Useful in CI; usually false for local dev.
strict = false
# Where the manifest is regenerated to. Committed to the repo.
manifest_path = "design_docs/manifest.toml"
